# Active Directory MCP server — Docker Compose (network daemon mode).
#
# This composes the server as a long-running HTTP/SSE daemon so an MCP client
# can reach it over the network. For the embedded/stdio pattern (single MCP
# client such as Claude Desktop spawning the container), see the README
# "Run via Docker (stdio)" section instead.

services:
  ad-mcp:
    build: .
    image: ms-ad-mcp:latest
    container_name: ad-mcp
    restart: unless-stopped
    # Run as a streamable-http daemon (default). Swap to "sse" if preferred.
    command: ["--transport", "http", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    # Credentials. Prefer a mounted config file (see volumes) or AD_* env.
    environment:
      AD_CONFIG_FILE: /config/ad.json
      # Pin LDAP servers explicitly to skip DNS SRV discovery if needed:
      # AD_LDAP_URIS: "ldaps://dc01.ad.example.com:636"
      # SIMPLE (default), NTLM or GSSAPI:
      # AD_AUTH_MECHANISM: "SIMPLE"
      # Require a bearer token on the MCP endpoints (see /health for the
      # credential-free health check). Generate with: `openssl rand -hex 32`.
      AD_MCP_AUTH_TOKEN: ${AD_MCP_AUTH_TOKEN:?set this to a strong random value}
    volumes:
      # Mount a config file written by `config init` (0600). The container
      # runs as a non-root user; set file perms accordingly.
      - ./ad.json:/config/ad.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=6).close()"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s